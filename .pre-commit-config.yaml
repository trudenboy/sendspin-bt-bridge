repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      # Captured bluetoothctl transcripts are byte-for-byte fixtures: the
      # trailing spaces after a prompt and the missing final newline are
      # part of what the parsers must handle, so they are left alone.
      - id: trailing-whitespace
        exclude: ^tests/support/transcripts/
      - id: end-of-file-fixer
        exclude: ^tests/support/transcripts/
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pin matches the ruff version in [project.optional-dependencies].dev
    # so local pre-commit and CI's `uv run ruff` apply the same rules
    # and formatter. Bump alongside that pin.
    rev: v0.16.1
    hooks:
      - id: ruff
        args:
          - --fix
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.2
    hooks:
      # `uv lock --check` — fail if uv.lock is out of sync with pyproject.toml.
      - id: uv-lock
      # Regenerate requirements.txt from uv.lock and abort the commit if the
      # working tree's requirements.txt would change. Keeps the LXC pip3
      # install path on the same dependency set as Docker / CI / local dev.
      - id: uv-export
        args:
          - "--no-hashes"
          - "--no-dev"
          - "--no-emit-project"
          - "--output-file"
          - "requirements.txt"

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # Run mypy through uv so the version + env match what
        # ``[project.optional-dependencies].dev`` (and CI's ``uv run mypy``)
        # use, instead of relying on a global ``mypy`` on PATH.
        entry: uv run mypy --config-file pyproject.toml
        language: system
        types: [python]
        require_serial: true
        # Match CI's src-only mypy scope. Explicit filenames bypass mypy's
        # [tool.mypy].exclude policy, so retain its excluded source trees too.
        files: ^src/sendspin_bridge/
        exclude: "(sendspin-cli/|scripts/|custom_components/)"

      - id: lint-changelog
        name: lint CHANGELOG.md (Keep a Changelog discipline)
        # Enforces R1–R10 from CONTRIBUTING.md § Changelog Discipline.
        # Forward-only: stylistic rules (R5–R8) only check [Unreleased].
        entry: uv run python scripts/lint_changelog.py
        language: system
        files: '^CHANGELOG\.md$'
        pass_filenames: true
